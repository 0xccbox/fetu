name: fetu
description: Adaptive multi-protocol network client powered by Flutter and sing-box.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  meta: ^1.12.0

  # State Management & Dependency Injection
  provider: ^6.1.2
  get_it: ^7.7.0

  # Local & Secure Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3
  network_info_plus: ^5.0.3

  # Immutable Models & Serialization
  freezed_annotation: ^2.4.2
  json_annotation: ^4.9.0

  # Cryptography
  encrypt: ^5.0.3
  crypto: ^3.0.3
  cryptography: ^2.9.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1
  archive: ^3.6.1

  # UI & Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testing & Linting
  mockito: ^5.4.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/rules/
    - assets/translations/
