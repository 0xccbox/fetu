name: Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/core/ lib/design_system/ lib/features/ lib/app.dart lib/main.dart test/ tools/

      - name: Run static analysis
        run: flutter analyze

      - name: Run architecture checks
        run: dart run tools/architecture_check.dart

      - name: Run unit and widget tests
        run: flutter test
